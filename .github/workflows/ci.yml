name: ci

on:
  pull_request:
  push:
    branches: [main]
  # publish.yml runs it first, so a red build never ships.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The web app in a real browser against the real API: packages/e2e-web. Both servers are
  # started by the Playwright config, so this needs nothing but a browser.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The report, with a trace of every failed test, to open with `npx playwright show-report`.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/e2e-web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
