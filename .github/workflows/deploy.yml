name: deploy

on:
  # publish.yml runs this as part of a release, once ci passes and the Android build is
  # in review. Run it alone to ship a server fix without a new app.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# Both jobs ship the same commit to the same VM: the API, and the web app built for the
# addresses in the EXPO_PUBLIC_* repository variables (or secrets). They don't depend on each other, so
# they run side by side and one failing doesn't stop the other.
jobs:
  api:
    # Only main is deployed. The api job would only fetch main, and the web job would
    # publish whatever branch the run is on.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and redeploy
        uses: appleboy/ssh-action@v1
        env:
          # The commit the run started on, which in a publish is the one the app was
          # built from, not whatever main has moved on to in the 30 minutes since.
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          envs: SHA
          script: |
            set -e
            cd ~/sattle
            git fetch origin main
            # Fast-forward to that commit. If a later deploy already went past
            # it, this is a no-op rather than a step back.
            git merge --ff-only "$SHA"
            npm ci -w @sattle/api -w @sattle/core --include-workspace-root --no-audit --no-fund
            # Copy the database before the restart, which is when migrations run and
            # can't be undone. Named for the commit going out; keeps the last 20.
            npm run db:backup -w @sattle/api -- deploy "$(git rev-parse --short HEAD)"
            # Clear a start-limit hit by earlier crashes, or systemd refuses the restart.
            sudo systemctl reset-failed sattle || true
            if ! sudo systemctl restart sattle; then
              sudo journalctl -u sattle -n 50 --no-pager
              exit 1
            fi
            for i in $(seq 1 30); do
              # -m 2: a socket that accepts but never answers would hang past the 30s window.
              curl -fsS -m 2 localhost:3100/health && exit 0
              sleep 1
            done
            sudo journalctl -u sattle -n 50 --no-pager
            exit 1

  web:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the api job deploys.
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the web app
        working-directory: ./apps/mobile
        env:
          # Inlined into the bundle at build time. The two addresses are repository variables, or
          # secrets of the same name (variables suit them better: they're public, and a secret is
          # masked in every log line it appears in). Nothing in this file names a host.
          EXPO_PUBLIC_USE_MOCK: 'false'
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_APP_URL || secrets.EXPO_PUBLIC_APP_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ] || [ -z "$EXPO_PUBLIC_APP_URL" ]; then
            echo "::error::Set EXPO_PUBLIC_API_URL and EXPO_PUBLIC_APP_URL as repository variables (or secrets)"
            exit 1
          fi
          # What the app says it is when it reports how it's used (apps/mobile/src/analytics).
          export EXPO_PUBLIC_APP_VERSION="web-$(git rev-parse --short HEAD)"
          npx expo export --platform web --output-dir dist
          tar -czf "$GITHUB_WORKSPACE/sattle-web.tgz" -C dist .
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # For the check at the end: the address the build was made for.
          echo "APP_URL=$EXPO_PUBLIC_APP_URL" >> "$GITHUB_ENV"

      - name: Upload the build
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          source: sattle-web.tgz
          target: /tmp/sattle-web

      - name: Switch to the new build
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          envs: SHA,APP_URL
          script: |
            set -e
            R=/var/www/sattle-web
            # A later deploy may already be live, such as a server fix run by hand while
            # a publish waited for Play. Like the api job, don't step back over it. If
            # either commit is missing from ~/sattle, merge-base fails and this goes ahead.
            LIVE=$(basename "$(readlink "$R/current" || true)")
            if [ -n "$LIVE" ] && [ "$LIVE" != "$SHA" ] \
               && git -C ~/sattle merge-base --is-ancestor "$SHA" "$LIVE" 2>/dev/null; then
              echo "$LIVE is live and already includes $SHA; leaving it."
              rm -rf /tmp/sattle-web
              exit 0
            fi
            mkdir -p "$R/releases/$SHA"
            tar -xzf /tmp/sattle-web/sattle-web.tgz -C "$R/releases/$SHA"
            rm -rf /tmp/sattle-web
            # Swap the symlink with a rename, so nginx never sees a missing or half-written root.
            ln -sfn "releases/$SHA" "$R/current.tmp"
            mv -Tf "$R/current.tmp" "$R/current"
            # Keep the five newest builds for a quick manual rollback.
            ls -1t "$R/releases" | tail -n +6 | xargs -r -I{} rm -rf "$R/releases/{}"
            # The new build answers on the host the app was built for, asked of this machine directly.
            curl -fsS -m 5 -o /dev/null --resolve "${APP_URL#https://}:443:127.0.0.1" "$APP_URL/s/check"
