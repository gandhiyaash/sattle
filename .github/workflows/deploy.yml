name: deploy

on:
  # Deploy main only after ci passes on it, so a red build never reaches the server.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            set -e
            cd ~/sattle
            git pull --ff-only origin main
            npm ci -w @sattle/api -w @sattle/core --include-workspace-root --no-audit --no-fund
            sudo systemctl restart sattle
            for i in $(seq 1 30); do
              curl -fsS localhost:3100/health && exit 0
              sleep 1
            done
            sudo journalctl -u sattle -n 50 --no-pager
            exit 1
