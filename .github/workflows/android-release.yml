name: Create Android Release (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (none, patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      track:
        description: 'Play Store Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

# Two runs bumping the version at once would race on the branch and the tag.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without these the build would silently fall back to the debug key, which
          # neither Play nor users can update from.
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret $name"
              exit 1
            fi
          done

      - name: Check app config
        env:
          USE_MOCK: ${{ vars.EXPO_PUBLIC_USE_MOCK || 'false' }}
          API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://battle.axiosiiitl.dev' }}
          TRACK: ${{ github.event.inputs.track }}
        run: |
          # Both of these build fine and only show up once someone opens the app.
          if [ "$USE_MOCK" = "true" ] && [ "$TRACK" = "production" ]; then
            echo "::error::EXPO_PUBLIC_USE_MOCK is 'true'; refusing to ship the mock client to production"
            exit 1
          fi
          if [ "$USE_MOCK" != "true" ] && [ -z "$API_URL" ]; then
            echo "::error::Set the EXPO_PUBLIC_API_URL repository variable, or the app talks to localhost"
            exit 1
          fi

      - name: Configure Git
        if: ${{ github.event.inputs.bump_type != '' && github.event.inputs.bump_type != 'none' }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        if: ${{ github.event.inputs.bump_type != '' && github.event.inputs.bump_type != 'none' }}
        id: version_bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: |
          set -e
          # Commit and tag locally only. They are pushed after the build succeeds, so a
          # failed build leaves no version commit or tag behind.
          npm version "$BUMP_TYPE" --no-git-tag-version -w @sattle/mobile
          NEW_VERSION=$(node -p "require('./apps/mobile/package.json').version")
          git add apps/mobile/package.json package-lock.json
          git commit -m "chore(release): bump version to v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Install Dependencies
        run: npm ci

      - name: Determine Current Version
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          if [ -z "$NEW_VERSION" ]; then
            echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV
          fi
          echo "Building version: ${NEW_VERSION:-$VERSION}"

      - name: Setup Java Jdk
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which no longer exists in
          # cmdline-tools 16+ and makes sdkmanager fail. Gradle fetches platforms/build-tools.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Generate Native Android Project
        working-directory: ./apps/mobile
        # android/ is not committed; this creates it from app.json (package
        # com.chanakya.sattle) and applies plugins/withAndroidReleaseSigning.
        run: npx expo prebuild --platform android --no-install

      - name: Decode Keystore
        working-directory: ./apps/mobile/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # The keystore is stored as a base64 encoded string in secrets
          echo "$KEYSTORE_BASE64" | base64 --decode > sattle-release.keystore

      - name: Build Android APK and AAB
        working-directory: ./apps/mobile/android
        env:
          # EXPO_PUBLIC_* values are inlined into the JS bundle at build time. They are
          # public, so they live in repository variables rather than secrets.
          EXPO_PUBLIC_USE_MOCK: ${{ vars.EXPO_PUBLIC_USE_MOCK || 'false' }}
          # Default to the deployed API and web app; repository variables override them.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://battle.axiosiiitl.dev' }}
          EXPO_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_APP_URL || 'https://sattle.axiosiiitl.dev' }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease \
            -PSATTLE_VERSION_CODE="${{ github.run_number }}" \
            -PSATTLE_VERSION_NAME="$NEW_VERSION" \
            -PSATTLE_UPLOAD_STORE_FILE=sattle-release.keystore \
            -PSATTLE_UPLOAD_STORE_PASSWORD="$STORE_PASSWORD" \
            -PSATTLE_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
            -PSATTLE_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Push Version Bump
        if: ${{ github.event.inputs.bump_type != '' && github.event.inputs.bump_type != 'none' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Branch and tag go together so neither lands alone. No rebase-and-retry: if the
          # branch moved during the build, the tag would point at code that wasn't built.
          if ! git push --atomic origin "HEAD:$BRANCH" "refs/tags/v$NEW_VERSION"; then
            echo "::error::$BRANCH moved while building v$NEW_VERSION. Re-run the workflow."
            exit 1
          fi

      - name: Extract Release Notes
        id: changelog
        run: |
          set -e
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match="v*" HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)")
          echo -e "Changes in this release:\n\n$COMMITS" > release_notes.md

      - name: Create GitHub Release
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release v${{ env.NEW_VERSION }}
          body_path: release_notes.md
          files: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback Release via GitHub CLI
        if: steps.release.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ env.NEW_VERSION }}
        run: |
          set -e
          echo "action-gh-release encountered an issue, falling back to GitHub CLI with retry..."
          for attempt in 1 2 3; do
            echo "Release attempt $attempt..."
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" -F release_notes.md && \
              gh release upload "$TAG" apps/mobile/android/app/build/outputs/apk/release/app-release.apk apps/mobile/android/app/build/outputs/bundle/release/app-release.aab --clobber && break
            else
              gh release create "$TAG" apps/mobile/android/app/build/outputs/apk/release/app-release.apk apps/mobile/android/app/build/outputs/bundle/release/app-release.aab --title "Release $TAG" -F release_notes.md && break
            fi
            sleep 5
          done

      - name: Upload to Google Play Store
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        if: ${{ env.PLAY_STORE_CREDENTIALS != '' }}
        # Pinned to a commit: this action is handed the Play service account key.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          packageName: com.chanakya.sattle
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
