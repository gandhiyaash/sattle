name: Create Android Release (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump from the latest vX.Y.Z tag (none rebuilds that version)'
        required: true
        default: 'patch'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      track:
        description: 'Play Store Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      update_priority:
        description: 'In-app update priority (0-3: download in the background, 4-5: take over the screen)'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

# Two runs bumping the version at once would race for the same tag.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without these the build would silently fall back to the debug key, which
          # neither Play nor users can update from.
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret $name"
              exit 1
            fi
          done

      - name: Check app config
        env:
          USE_MOCK: ${{ vars.EXPO_PUBLIC_USE_MOCK || 'false' }}
          API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://battle.axiosiiitl.dev' }}
          TRACK: ${{ github.event.inputs.track }}
        run: |
          # Both of these build fine and only show up once someone opens the app.
          if [ "$USE_MOCK" = "true" ] && [ "$TRACK" = "production" ]; then
            echo "::error::EXPO_PUBLIC_USE_MOCK is 'true'; refusing to ship the mock client to production"
            exit 1
          fi
          if [ "$USE_MOCK" != "true" ] && [ -z "$API_URL" ]; then
            echo "::error::Set the EXPO_PUBLIC_API_URL repository variable, or the app talks to localhost"
            exit 1
          fi

      - name: Determine Version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          REF: ${{ github.ref_name }}
        run: |
          set -e
          # The tag marks the commit that was built, so releases come from main only.
          if [ "$REF" != "main" ]; then
            echo "::error::Releases are cut from main; this run is on $REF."
            exit 1
          fi
          # Releases are tags only. main only takes pull requests, so nothing is
          # committed back: the newest vX.Y.Z tag is the current version, and
          # apps/mobile/package.json is only the starting point before the first one.
          LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          BASE=${LAST#v}
          BASE=${BASE:-$(node -p "require('./apps/mobile/package.json').version")}
          IFS=. read -r MAJOR MINOR PATCH <<<"$BASE"
          case "$BUMP_TYPE" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            *)     NEW_VERSION="$BASE" ;;
          esac
          # A bump must not land on a version that's already out. `none` rebuilds the
          # latest one, whose tag stays where it is.
          if [ "$BUMP_TYPE" != "none" ] && git rev-parse -q --verify "refs/tags/v$NEW_VERSION" >/dev/null; then
            echo "::error::v$NEW_VERSION is already tagged."
            exit 1
          fi
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "Building v$NEW_VERSION (latest tag: ${LAST:-none})"

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java Jdk
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which no longer exists in
          # cmdline-tools 16+ and makes sdkmanager fail. Gradle fetches platforms/build-tools.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Generate Native Android Project
        working-directory: ./apps/mobile
        # android/ is not committed; this creates it from app.json (package
        # com.chanakya.sattle) and applies plugins/withAndroidReleaseSigning.
        run: npx expo prebuild --platform android --no-install

      - name: Decode Keystore
        working-directory: ./apps/mobile/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # The keystore is stored as a base64 encoded string in secrets
          echo "$KEYSTORE_BASE64" | base64 --decode > sattle-release.keystore

      - name: Build Android APK and AAB
        working-directory: ./apps/mobile/android
        env:
          # EXPO_PUBLIC_* values are inlined into the JS bundle at build time. They are
          # public, so they live in repository variables rather than secrets.
          EXPO_PUBLIC_USE_MOCK: ${{ vars.EXPO_PUBLIC_USE_MOCK || 'false' }}
          # Default to the deployed API and web app; repository variables override them.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://battle.axiosiiitl.dev' }}
          EXPO_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_APP_URL || 'https://sattle.axiosiiitl.dev' }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease \
            -PSATTLE_VERSION_CODE="${{ github.run_number }}" \
            -PSATTLE_VERSION_NAME="$NEW_VERSION" \
            -PSATTLE_UPLOAD_STORE_FILE=sattle-release.keystore \
            -PSATTLE_UPLOAD_STORE_PASSWORD="$STORE_PASSWORD" \
            -PSATTLE_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
            -PSATTLE_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Tag the Release
        run: |
          set -e
          TAG="v$NEW_VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; rebuilding it without moving the tag."
            exit 0
          fi
          # Only the tag is pushed. The main ruleset covers the branch, not tags, so the
          # workflow's own token can push it, and a failed build never gets this far.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          if ! git push origin "refs/tags/$TAG"; then
            echo "::error::Pushing $TAG failed. If another run tagged it first, re-run with the next bump."
            exit 1
          fi

      - name: Extract Release Notes
        id: changelog
        run: |
          set -e
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match="v*" HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)")
          echo -e "Changes in this release:\n\n$COMMITS" > release_notes.md

      - name: Create GitHub Release
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release v${{ env.NEW_VERSION }}
          body_path: release_notes.md
          files: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback Release via GitHub CLI
        if: steps.release.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ env.NEW_VERSION }}
        run: |
          set -e
          echo "action-gh-release encountered an issue, falling back to GitHub CLI with retry..."
          for attempt in 1 2 3; do
            echo "Release attempt $attempt..."
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" -F release_notes.md && \
              gh release upload "$TAG" apps/mobile/android/app/build/outputs/apk/release/app-release.apk apps/mobile/android/app/build/outputs/bundle/release/app-release.aab --clobber && break
            else
              gh release create "$TAG" apps/mobile/android/app/build/outputs/apk/release/app-release.apk apps/mobile/android/app/build/outputs/bundle/release/app-release.aab --title "Release $TAG" -F release_notes.md && break
            fi
            sleep 5
          done

      - name: Upload to Google Play Store
        env:
          PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        if: ${{ env.PLAY_STORE_CREDENTIALS != '' }}
        # Pinned to a commit: this action is handed the Play service account key.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          packageName: com.chanakya.sattle
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          # Read by the app's updater (apps/mobile/src/updates/updater.ts) on installed copies.
          inAppUpdatePriority: ${{ github.event.inputs.update_priority }}
          status: completed
