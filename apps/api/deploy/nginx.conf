server {
    listen 80;
    listen [::]:80;
    server_name sattle.axiosiiitl.dev;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        # Fixed host, not $host: never redirect to whatever Host the client sent.
        return 301 https://sattle.axiosiiitl.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sattle.axiosiiitl.dev;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/sattle.axiosiiitl.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sattle.axiosiiitl.dev/privkey.pem;
    # Sets TLS 1.2/1.3, the cipher list and the session cache. Repeating any of
    # those directives here makes `nginx -t` fail as a duplicate.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The API only serves JSON and SSE, so nothing may frame, sniff or embed it.
    # These sit at server level; an add_header inside a location would drop them all.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Request bodies are small JSON.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Settlement updates stream over SSE; do not buffer them.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
