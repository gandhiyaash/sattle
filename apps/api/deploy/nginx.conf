server {
    listen 80;
    listen [::]:80;
    server_name sattle.axiosiiitl.dev;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sattle.axiosiiitl.dev;
    ssl_certificate /etc/letsencrypt/live/sattle.axiosiiitl.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sattle.axiosiiitl.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Settlement updates stream over SSE; do not buffer them.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
