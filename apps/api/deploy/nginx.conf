# POST /analytics/events is public and keeps what it's sent, so each visitor's address gets one
# post a second. The app sends one every few seconds, and up to ten together when a backlog goes,
# which the burst below lets through. The address is the visitor's, not Cloudflare's: see
# set_real_ip_from below. This file is included inside nginx's http block, where a zone has to be.
limit_req_zone $binary_remote_addr zone=analytics:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name battle.axiosiiitl.dev;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        # Fixed host, not $host: never redirect to whatever Host the client sent.
        return 301 https://battle.axiosiiitl.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name battle.axiosiiitl.dev;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/battle.axiosiiitl.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/battle.axiosiiitl.dev/privkey.pem;
    # Sets TLS 1.2/1.3, the cipher list and the session cache. Repeating any of
    # those directives here makes `nginx -t` fail as a duplicate.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The API only serves JSON and SSE, so nothing may frame, sniff or embed it.
    # These sit at server level; an add_header inside a location would drop them all.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Cloudflare fronts this host, so the peer is one of its edge nodes, shared by everyone in that
    # region. $remote_addr, and so the analytics limit and X-Real-IP, takes the visitor's address
    # from the header Cloudflare sets instead, but only on connections from its ranges: port 443 is
    # reachable directly, and anyone else could send the header too. The ranges are Cloudflare's
    # published list (https://www.cloudflare.com/ips), as of October 2026.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Request bodies are small JSON.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Settlement updates stream over SSE; do not buffer them.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /analytics/ {
        # Past the burst, 429: the app tries again later rather than dropping the batch.
        limit_req zone=analytics burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
