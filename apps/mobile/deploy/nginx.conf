# The web app: the guest pay page (/s/<token>) and the rest of the app in a browser.
# Static files from `expo export --platform web`; the API is battle.axiosiiitl.dev.
server {
    listen 80;
    listen [::]:80;
    server_name sattle.axiosiiitl.dev;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        # Fixed host, not $host: never redirect to whatever Host the client sent.
        return 301 https://sattle.axiosiiitl.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sattle.axiosiiitl.dev;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/sattle.axiosiiitl.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sattle.axiosiiitl.dev/privkey.pem;
    # Sets TLS 1.2/1.3, the cipher list and the session cache. Repeating any of
    # those directives here makes `nginx -t` fail as a duplicate.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The deploy job unpacks each build into releases/<sha> and repoints this symlink.
    root /var/www/sattle-web/current;

    # These sit at server level; an add_header inside a location would drop them all.
    # Pay links carry their token in the path, so no Referer may leak it.
    # react-native-web injects its styles at runtime, hence 'unsafe-inline' for styles only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://battle.axiosiiitl.dev; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

    # Bundles are content-hashed, so they never change under the same name.
    location /_expo/static/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html names the current bundle, so it must always be revalidated.
    location = /index.html {
        expires -1;
    }

    # Static pages answer without .html (/privacy); every other path is the
    # single-page app, so /s/<token> loads index.html.
    location / {
        try_files $uri $uri.html /index.html;
    }
}
